name: CI

# Runs on pull requests only. `main` is branch-protected, so every change
# reaches it through a PR.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # The version comes from package.json's `packageManager` field.

      - name: Setup Node.js
        # Must run after pnpm/action-setup: the pnpm cache needs pnpm on PATH.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Coverage Ratchet
        run: node .coverage/check-coverage-ratchet.js

      - name: Build
        run: pnpm run build
