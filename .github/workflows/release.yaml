name: Release

# Fires when a GitHub Release is published. The release tag must be the bare
# version, with no leading `v`.
on:
  release:
    types: [published]

permissions:
  contents: write      # upload assets onto the release
  id-token: write      # mint the OIDC token used for attestation
  attestations: write  # publish the attestation

jobs:
  publish-release-assets:
    name: Build and attach plugin files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The default ref is the commit the release tag points at.

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # The version comes from package.json's `packageManager` field.

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify manifest.json version matches the release tag
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ "$MANIFEST_VERSION" != "$TAG_NAME" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match the release tag ($TAG_NAME)."
            exit 1
          fi

      - name: Build
        # `pnpm run build` typechecks first. Lint and tests are not re-run:
        # every commit on `main` already passed the CI workflow.
        run: pnpm run build

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Attach plugin files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/main.js \
            dist/manifest.json \
            dist/styles.css \
            --clobber
